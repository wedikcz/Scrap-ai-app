name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lintDebug --console=plain --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: Debug assemble
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Decode release keystore (repo secret KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi

      - name: Release assemble (R8, resource shrink, signed)
        if: ${{ vars.RELEASE_SIGNING == 'enabled' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain --no-daemon

      - name: Upload release APK artifact
        if: ${{ vars.RELEASE_SIGNING == 'enabled' }}
        uses: actions/upload-artifact@v4
        with:
          name: scrapmaster-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-lint-reports
          path: |
            app/build/reports/
