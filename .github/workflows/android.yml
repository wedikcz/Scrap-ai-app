name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v4 is the current major (Node 24; cmdline-tools 20+). The platform and
      # build-tools are installed explicitly below so a runner image update
      # cannot silently change what the project compiles against.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain --no-daemon --no-configuration-cache --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon --no-configuration-cache --stacktrace

      - name: Debug assemble
        run: ./gradlew assembleDebug --console=plain --no-daemon --no-configuration-cache --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: scrapmaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Fork PRs do not receive repository secrets, so the signed release is
      # only attempted for pushes/manual runs on the main repository.
      - name: Decode release keystore (repo secret KEYSTORE_BASE64)
        if: ${{ vars.RELEASE_SIGNING == 'enabled' && github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi

      - name: Release assemble (R8, resource shrink, signed)
        if: ${{ vars.RELEASE_SIGNING == 'enabled' && github.event_name != 'pull_request' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain --no-daemon --no-configuration-cache --stacktrace

      - name: Upload release APK artifact
        if: ${{ vars.RELEASE_SIGNING == 'enabled' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: scrapmaster-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
